# Publishes the game to GitHub Pages as a static page.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Minifying only shrinks the file (nothing in it is secret). If it fails, publish the page as-is.
      - name: Build
        run: |
          mkdir site
          npx --yes html-minifier-terser@7.2.0 --collapse-whitespace --remove-comments --minify-css true \
            --minify-js '{"mangle":{"toplevel":true},"compress":{"passes":2}}' \
            -o site/index.html index.html || cp index.html site/index.html
          test -s site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
